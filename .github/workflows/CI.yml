name: CI

on: [push]
jobs:
build-and-test:
runs-on: Ubuntu-latest

strategy:
  matrix:
    node-version: [20.x]

steps:
  -name: Checkout Code
  uses: actions/checkout@v3

  -name: Use Node.js ${{ matrix.node-version }}
  uses: actions/setup-node@v3
  with:
     node-version: ${{ matrix.node-version }}
     cache: "pnpm"

-name: Install pnpm
uses: pnpm/action-setup@v2
with:
    version: 8
    run_install: false #it tells that its not to install dependencies yet (we'll do that later)
    cache: true


-name: Install dependencies
run: pnpm install
    
-name: Lint
run: pnpm run lint
      
-name: Build
run: pnpm run build
    
-name: Test
run: pnpm test
    
- name: Upload build artifact
uses: actions/upload-artifact@v3
with:
name: dist-files
path: dist/